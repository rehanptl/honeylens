{% load humanize %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>{% block title %}HoneyLens{% endblock %} · HoneyLens</title>
<style>
  :root {
    --bg: #f4f4f2; --surface: #fcfcfb; --border: #e3e2de;
    --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --accent: #2a78d6; --bar: #2a78d6; --grid: #e8e7e3;
    --seq-1: #cde2fb; --seq-2: #86b6ef; --seq-3: #3987e5; --seq-4: #1c5cab;
    --sev-high: #d03b3b; --sev-medium: #ec835a; --sev-low: #0ca30c;
    --code-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --surface: #1a1a19; --border: #2e2e2c;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
      --accent: #3987e5; --bar: #3987e5; --grid: #2e2e2c;
      --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #86b6ef;
      --code-bg: #232321;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  header .wrap { display: flex; align-items: center; gap: 28px; height: 56px; }
  .brand { font-weight: 700; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  nav a { color: var(--text-2); text-decoration: none; margin-right: 18px; padding: 17px 0; }
  nav a.on { color: var(--text); border-bottom: 2px solid var(--accent); }
  main { padding: 24px 0 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--text-2); margin: 0 0 20px; }
  a { color: var(--accent); }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .kpi .l { color: var(--text-2); font-size: 12.5px; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 8px; align-items: center; margin: 5px 0; }
  .hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .hbar .track { height: 10px; }
  .hbar .fill { height: 10px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .num { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .hbar:hover .fill { filter: brightness(1.15); }
  svg text { fill: var(--muted); font-size: 11px; }
  svg .gl { stroke: var(--grid); }
  svg rect.b { fill: var(--bar); }
  svg rect.b:hover { filter: brightness(1.2); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; font-size: 12.5px; }
  td.n { font-variant-numeric: tabular-nums; text-align: right; }
  th.n { text-align: right; }
  code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; color: var(--text-2); margin: 2px 4px 2px 0; white-space: nowrap; text-decoration: none; }
  .sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .sev::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
  .sev.high::before { background: var(--sev-high); }
  .sev.medium::before { background: var(--sev-medium); }
  .sev.low::before { background: var(--sev-low); }
  .muted { color: var(--muted); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters a { text-decoration: none; }
  .filters a.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .empty { color: var(--text-2); padding: 30px; text-align: center; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">Honey<span>Lens</span></div>
  <nav>
    <a href="{% url 'overview' %}" class="{% if nav == 'overview' %}on{% endif %}">Overview</a>
    <a href="{% url 'clusters' %}" class="{% if nav == 'clusters' %}on{% endif %}">Attack patterns</a>
    <a href="{% url 'attack' %}" class="{% if nav == 'attack' %}on{% endif %}">MITRE ATT&amp;CK</a>
  </nav>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
