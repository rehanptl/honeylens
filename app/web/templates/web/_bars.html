{% load humanize %}{% for r in rows %}
<div class="hbar" title="{{ r.label }}: {{ r.value }}">
  <div class="lab">{{ r.label }}</div>
  <div class="track"><div class="fill" style="width: {{ r.pct }}%"></div></div>
  <div class="num">{{ r.value|intcomma }}</div>
</div>
{% empty %}<div class="muted">No data yet.</div>{% endfor %}
